<script>
(function(){
  function applyMonitorProfile(){
    var dpr = window.devicePixelRatio || 1;
    var sw = Math.round((window.screen && window.screen.width || window.innerWidth) * dpr);
    var sh = Math.round((window.screen && window.screen.height || window.innerHeight) * dpr);
    var root = document.documentElement;
    root.classList.remove('monitor-fhd','monitor-qhd','monitor-large');
    if(sw >= 2300 && sh >= 1250){
      root.classList.add('monitor-qhd');
    } else if(sw >= 1800 && sh >= 950){
      root.classList.add('monitor-fhd');
    } else {
      root.classList.add('monitor-large');
    }
  }
  applyMonitorProfile();
  window.addEventListener('resize', applyMonitorProfile, {passive:true});
})();
</script>
